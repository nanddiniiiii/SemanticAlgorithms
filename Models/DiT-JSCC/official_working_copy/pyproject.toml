[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dit-jscc"
version = "0.1.0"
description = "Inference toolkit for DiT-JSCC: diffusion transformers for generative joint source-channel coding"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Kailin Tan"},
  {name = "Jincheng Dai"},
]
dependencies = [
  "absl-py>=2.0",
  "einops>=0.7",
  "gradio>=4.44,<6",
  "ml-collections>=0.1.1",
  "numpy>=1.24,<3",
  "Pillow>=10",
  "timm>=1.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
dit-jscc = "dit_jscc.cli:main"

[project.urls]
Homepage = "https://github.com/semcomm/DiTJSCC"
Repository = "https://github.com/semcomm/DiTJSCC"

[tool.setuptools.packages.find]
include = ["dit_jscc*", "inference_core*", "configs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
